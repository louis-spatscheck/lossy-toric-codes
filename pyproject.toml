[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lossytoric"
version = "0.1.0"
description = "Toric-code thresholds under bit-flip + erasure (photon-loss) noise"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pymatching>=2.2", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
